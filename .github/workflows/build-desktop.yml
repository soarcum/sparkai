name: Build Windows Desktop EXE

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'sparkai-desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./sparkai-desktop
        run: npm install

      - name: Build Frontend
        working-directory: ./sparkai-desktop
        run: npx vite build

      - name: List Build Output
        working-directory: ./sparkai-desktop
        run: |
          echo "=== dist ==="
          dir dist
          echo "=== dist-electron ==="
          dir dist-electron

      - name: Download Electron Binary
        working-directory: ./sparkai-desktop
        run: npx electron --version
        env:
          ELECTRON_CACHE: "C:\\electron-cache"

      - name: Package EXE
        working-directory: ./sparkai-desktop
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: "electron-builder"
          ELECTRON_BUILDER_CACHE: "C:\\electron-cache"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkAI-Windows-Installer
          path: sparkai-desktop/output-prod/SparkAI-Setup-*.exe

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkAI-Windows-Portable
          path: sparkai-desktop/output-prod/SparkAI-*.exe
